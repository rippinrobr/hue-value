# Checks the app on every pull request and on main: types, style, unit and golden tests,
# the worker, offline and update behavior, and the browser tests. Cloudflare builds the
# preview and deploys on its own.
name: App

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Install the test browser
        run: npx playwright install --with-deps chromium
      - run: npm run test:all
      - name: Keep the browser test report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app/test-results
          retention-days: 7
