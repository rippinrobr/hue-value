# Staging API on Fly.io. Deploy from the repo root, so the image can include data/:
#   fly deploy . --config api/fly.staging.toml --dockerfile api/Dockerfile
# Merging to main does this through .github/workflows/api-deploy.yml.
app = "hue-value-api-staging"
primary_region = "iad"

[env]
  APP_ENV = "staging"
  LOG_LEVEL = "info"

[[mounts]]
  source = "data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/v1/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
